    - tls://1-7cpqagd7alx73px777p5766z3x77h6p7jjvaasa.max.rethinkdns.com
  direct-nameserver:
    - 78.157.42.100
    - 78.157.42.101
  proxy-server-nameserver:
    - 2606:4700:4700::1111
    - 2606:4700:4700::1001
    - 2001:4860:4860::8888
    - 2001:4860:4860::8844
    - 1.1.1.1
    - 8.8.8.8
    - 8.8.4.4
    - 9.9.9.9
    - 223.5.5.5
    - 77.88.8.8
    - 2400:3200::1
    - 2a02:6b8::feed:0ff
    - 2620:fe::fe
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
