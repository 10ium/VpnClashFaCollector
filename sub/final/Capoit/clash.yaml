proxy-groups:
  - name: نوع انتخاب پروکسی 🔀
    type: select
    proxies:
      - اتصال پایدار 🔗
      - خودکار (بهترین پینگ) 🤖
      - دستی 🤏🏻
      - پشتیبان (در صورت قطعی) 🧯
      - توزیع بار (پایدار) 🧲
      - توزیع بار (موقت) ⏳
      - توزیع بار (گردشی) 🔁
      - قطع اینترنت ⛔
      - بدون فیلترشکن 🛡️
  - name: دستی 🤏🏻
    type: select
    proxies:
      - "@Capoit"
      - "@Capoit`"
      - "@Capoit 2"
      - "@Capoit 3"
      - "@Capoit 4"
      - "@Capoit 5"
      - "@Capoit 6"
      - "@Capoit 7"
      - "@Capoit` 2"
  - name: خودکار (بهترین پینگ) 🤖
    type: url-test
    url: https://api.v2fly.org/checkConnection.svgz
    interval: 600
    tolerance: 50
    proxies:
      - "@Capoit"
      - "@Capoit`"
      - "@Capoit 2"
      - "@Capoit 3"
      - "@Capoit 4"
      - "@Capoit 5"
      - "@Capoit 6"
      - "@Capoit 7"
      - "@Capoit` 2"
  - name: پشتیبان (در صورت قطعی) 🧯
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    proxies:
      - "@Capoit"
      - "@Capoit`"
      - "@Capoit 2"
      - "@Capoit 3"
      - "@Capoit 4"
      - "@Capoit 5"
      - "@Capoit 6"
      - "@Capoit 7"
      - "@Capoit` 2"
  - name: اتصال پایدار 🔗
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 30
    tolerance: 50
    proxies:
      - خودکار (بهترین پینگ) 🤖
      - پشتیبان (در صورت قطعی) 🧯
      - دستی 🤏🏻
  - name: توزیع بار (پایدار) 🧲
