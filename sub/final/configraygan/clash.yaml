proxy-groups:
  - name: نوع انتخاب پروکسی 🔀
    type: select
    proxies:
      - اتصال پایدار 🔗
      - خودکار (بهترین پینگ) 🤖
      - دستی 🤏🏻
      - پشتیبان (در صورت قطعی) 🧯
      - توزیع بار (پایدار) 🧲
      - توزیع بار (موقت) ⏳
      - توزیع بار (گردشی) 🔁
      - قطع اینترنت ⛔
      - بدون فیلترشکن 🛡️
  - name: دستی 🤏🏻
    type: select
    proxies:
      - "@configraygan"
      - "@configraygan 2"
      - "@configraygan 3"
      - "@configraygan لطفا برای حمایت جوین شید"
      - configraygan
      - "@configraygan 4"
      - "@configraygan 5"
      - test@configraygan
      - "@configraygan 6"
      - "@configraygan`"
      - "@configraygan 7"
      - "@configraygan 8"
      - "@configraygan 9"
      - "@configraygan 10"
      - چنل عضو شو @configraygan
  - name: خودکار (بهترین پینگ) 🤖
    type: url-test
    url: https://api.v2fly.org/checkConnection.svgz
    interval: 600
    tolerance: 50
    proxies:
      - "@configraygan"
      - "@configraygan 2"
      - "@configraygan 3"
      - "@configraygan لطفا برای حمایت جوین شید"
      - configraygan
      - "@configraygan 4"
      - "@configraygan 5"
      - test@configraygan
      - "@configraygan 6"
      - "@configraygan`"
      - "@configraygan 7"
      - "@configraygan 8"
      - "@configraygan 9"
      - "@configraygan 10"
      - چنل عضو شو @configraygan
  - name: پشتیبان (در صورت قطعی) 🧯
    type: fallback
    url: https://www.gstatic.com/generate_204
