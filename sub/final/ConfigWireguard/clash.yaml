proxy-groups:
  - name: نوع انتخاب پروکسی 🔀
    type: select
    proxies:
      - اتصال پایدار 🔗
      - خودکار (بهترین پینگ) 🤖
      - دستی 🤏🏻
      - پشتیبان (در صورت قطعی) 🧯
      - توزیع بار (پایدار) 🧲
      - توزیع بار (موقت) ⏳
      - توزیع بار (گردشی) 🔁
      - قطع اینترنت ⛔
      - بدون فیلترشکن 🛡️
  - name: دستی 🤏🏻
    type: select
    proxies:
      - "@alitexelc"
      - "@alitexelc 2"
      - "@alitexelc 3"
      - "@alitexelc 4"
      - ¹
      - ²
      - "@alitexelc 5"
      - "@alitexelc 6"
      - "@alitexelc 7"
      - "@alitexelc 8"
      - "@alitexelc 9"
      - "@alitexelc 10"
      - "@alitexelc 11"
      - "@alitexelc 12"
  - name: خودکار (بهترین پینگ) 🤖
    type: url-test
    url: https://api.v2fly.org/checkConnection.svgz
    interval: 600
    tolerance: 50
    proxies:
      - "@alitexelc"
      - "@alitexelc 2"
      - "@alitexelc 3"
      - "@alitexelc 4"
      - ¹
      - ²
      - "@alitexelc 5"
      - "@alitexelc 6"
      - "@alitexelc 7"
      - "@alitexelc 8"
      - "@alitexelc 9"
      - "@alitexelc 10"
      - "@alitexelc 11"
      - "@alitexelc 12"
