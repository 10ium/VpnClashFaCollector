proxy-groups:
  - name: نوع انتخاب پروکسی 🔀
    type: select
    proxies:
      - اتصال پایدار 🔗
      - خودکار (بهترین پینگ) 🤖
      - دستی 🤏🏻
      - پشتیبان (در صورت قطعی) 🧯
      - توزیع بار (پایدار) 🧲
      - توزیع بار (موقت) ⏳
      - توزیع بار (گردشی) 🔁
      - قطع اینترنت ⛔
      - بدون فیلترشکن 🛡️
  - name: دستی 🤏🏻
    type: select
    proxies:
      - "@vasl_bashim"
      - "@vasl_bashim 2"
      - "@vasl_bashim 3"
      - "@vasl_bashim 4"
      - "@vasl_bashim 5"
      - "@vasl_bashim 6"
      - "@vasl_bashim 7"
      - "@vasl_bashim 8"
      - "@vasl_bashim 9"
      - "@vasl_bashim 10"
  - name: خودکار (بهترین پینگ) 🤖
    type: url-test
    url: https://api.v2fly.org/checkConnection.svgz
    interval: 600
    tolerance: 50
    proxies:
      - "@vasl_bashim"
      - "@vasl_bashim 2"
      - "@vasl_bashim 3"
      - "@vasl_bashim 4"
      - "@vasl_bashim 5"
      - "@vasl_bashim 6"
      - "@vasl_bashim 7"
      - "@vasl_bashim 8"
      - "@vasl_bashim 9"
      - "@vasl_bashim 10"
  - name: پشتیبان (در صورت قطعی) 🧯
    type: fallback
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    proxies:
      - "@vasl_bashim"
      - "@vasl_bashim 2"
      - "@vasl_bashim 3"
      - "@vasl_bashim 4"
      - "@vasl_bashim 5"
      - "@vasl_bashim 6"
      - "@vasl_bashim 7"
      - "@vasl_bashim 8"
      - "@vasl_bashim 9"
      - "@vasl_bashim 10"
  - name: اتصال پایدار 🔗
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 30
    tolerance: 50
    proxies:
      - خودکار (بهترین پینگ) 🤖
      - پشتیبان (در صورت قطعی) 🧯
      - دستی 🤏🏻
  - name: توزیع بار (پایدار) 🧲
    type: load-balance
    strategy: consistent-hashing
    url: https://api.v2fly.org/checkConnection.svgz
    interval: 600
    proxies:
      - "@vasl_bashim"
      - "@vasl_bashim 2"
      - "@vasl_bashim 3"
      - "@vasl_bashim 4"
      - "@vasl_bashim 5"
      - "@vasl_bashim 6"
      - "@vasl_bashim 7"
      - "@vasl_bashim 8"
      - "@vasl_bashim 9"
      - "@vasl_bashim 10"
  - name: توزیع بار (گردشی) 🔁
    type: load-balance
    strategy: consistent-hashing
    url: https://api.v2fly.org/checkConnection.svgz
    interval: 600
    proxies:
      - "@vasl_bashim"
      - "@vasl_bashim 2"
      - "@vasl_bashim 3"
      - "@vasl_bashim 4"
      - "@vasl_bashim 5"
      - "@vasl_bashim 6"
      - "@vasl_bashim 7"
      - "@vasl_bashim 8"
